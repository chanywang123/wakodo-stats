    function fmtTwd(n) {
      return new Intl.NumberFormat("zh-TW", { style: "currency", currency: "TWD", maximumFractionDigits: 0 }).format(Number(n || 0));
    }
    
    function fmtNum(n) {
      return Number(n || 0).toLocaleString();

    // ===== 日期工具 =====
    function parseISODateLocal(dateStr){
      const [y, m, d] = String(dateStr).split("-").map(Number);
      const dt = new Date(y, (m || 1) - 1, d || 1);
      dt.setHours(0,0,0,0);
      return dt;
    }
    function toISODateLocal(dt){
      const y = dt.getFullYear();
      const m = String(dt.getMonth() + 1).padStart(2, "0");
      const d = String(dt.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }
    function addDays(dt, days){
      const x = new Date(dt);
      x.setDate(x.getDate() + days);
      x.setHours(0,0,0,0);
      return x;
    }

    function getWeekRange(anyIsoDateStr){
      const date = parseISODateLocal(anyIsoDateStr);
      const day = date.getDay(); 
      const deltaToMonday = (day + 6) % 7; 
      const monday = addDays(date, -deltaToMonday);
      const sunday = addDays(monday, 6);
      return { start: monday, end: sunday };
    }

    function getMajorMonth(isoDateStr) {
      const wkStart = parseISODateLocal(isoDateStr);
      const counts = new Map();
      for (let i = 0; i < 7; i++) {
        const x = addDays(wkStart, i);
        const key = `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}`;
        counts.set(key, (counts.get(key) || 0) + 1);
      }
      let bestKey = null;
      let bestDays = -1;
      for (const [k, days] of counts.entries()) {
        if (days > bestDays) { bestDays = days; bestKey = k; continue; }
        if (days === bestDays && bestKey && k > bestKey) bestKey = k;
      }
      const [yy, mm] = String(bestKey).split("-");
      return { year: Number(yy), month: Number(mm), key: bestKey };
    }

    function showWeekRangeText(isoDate) {
      const r = getWeekRange(isoDate);
      const s = r.start, e = r.end;
      dom.weekRangeDisplay.textContent = `週期：${s.getFullYear()}/${s.getMonth()+1}/${s.getDate()} ~ ${e.getFullYear()}/${e.getMonth()+1}/${e.getDate()}`;
      return r;
    }

    // ===== 計算來客數 =====
    function getVisitCounts(startDate, endDate) {
      let linan = 0, nanke = 0;
      if (!startDate || !endDate) return { linan: '-', nanke: '-' };
      
      for (const v of allVisits) {
        if (v.form_date >= startDate && v.form_date <= endDate) {
          if (v.store_branch === "臨安店") linan++;
          else if (v.store_branch === "南科店") nanke++;
        }
      }
      return { linan, nanke };
    }

    dom.zoomSlider.addEventListener("input", (e) => {
      if (!performanceChart || !chartXOriginal) return;
      const t = Number(e.target.value) / 100;
      const origRange = chartXOriginal.max - chartXOriginal.min;
      const minRange = origRange * 0.02;
      const range = Math.max(minRange, origRange * (1 - t));
      const xScale = performanceChart.scales.x;
      const anchor = (hoverXValue != null) ? hoverXValue : (xScale.min + xScale.max) / 2;
      const ratio = (hoverXValue != null) ? hoverXRatio : 0.5;
      let min = anchor - ratio * range;
      let max = min + range;
      if (min < chartXOriginal.min) { min = chartXOriginal.min; max = min + range; }
      if (max > chartXOriginal.max) { max = chartXOriginal.max; min = max - range; }
      performanceChart.zoomScale("x", { min, max }, "none");
    });

    // 抓取客源資料 (分頁抓取，確保資料完整)
    async function fetchVisitsData() {
      let data = [];
      let page = 0;
      const PAGE_SIZE = 1000;
      while(true) {
        const res = await supabase.from("visits").select("form_date, store_branch").range(page * PAGE_SIZE, (page + 1) * PAGE_SIZE - 1);
        if (res.error || !res.data || !res.data.length) break;
        data = data.concat(res.data);
        if (res.data.length < PAGE_SIZE) break;
        page++;
      }
      return data;
    }

    async function refreshData() {
      dom.dataStatus.textContent = "載入中...";
      
      // 平行抓取業績與客源資料
      const [salesRes, visitsData] = await Promise.all([
        supabase.from("sales_performance").select("*").order("year", { ascending: true }).order("month", { ascending: true }).order("week_start_date", { ascending: true }),
        fetchVisitsData()
      ]);

      if (salesRes.error) {
        console.error(salesRes.error);
        dom.dataStatus.textContent = "載入失敗";
        Swal.fire({ icon: "error", title: "載入失敗", text: salesRes.error.message, background: "#1e293b", color: "#fff" });
        allData = [];
      } else {
        allData = salesRes.data || [];
        allVisits = visitsData || [];
        dom.dataStatus.textContent = `共 ${allData.length} 筆`;
      }
      
      renderChart();
      renderKPI();
      renderTable();
    }

    function renderChart() {
      const weeklyData = allData.filter(d => d.period_type === "weekly" && d.week_start_date);
      if (!weeklyData.length) {
        if (performanceChart) performanceChart.destroy();
        dom.dataStatus.textContent = "尚無週資料";
        return;
      }

      let chartData, labels, linanData, nankeData, linanVisitsData, nankeVisitsData;

      if (chartViewMode === "weekly") {
        chartData = [...weeklyData].sort((a, b) => parseISODateLocal(a.week_start_date).getTime() - parseISODateLocal(b.week_start_date).getTime());
        labels = chartData.map(d => {
          const s = parseISODateLocal(d.week_start_date);
          const e = addDays(s, 6);
          return `${s.getMonth() + 1}/${s.getDate()}-${e.getMonth() + 1}/${e.getDate()}`;
        });
        linanData = chartData.map(d => Number(d.linan_amount || 0));
        nankeData = chartData.map(d => Number(d.nanke_amount || 0));
        
        linanVisitsData = chartData.map(d => {
          const c = getVisitCounts(d.week_start_date, d.week_end_date);
          return c.linan === '-' ? 0 : c.linan;
        });
        nankeVisitsData = chartData.map(d => {
          const c = getVisitCounts(d.week_start_date, d.week_end_date);
          return c.nanke === '-' ? 0 : c.nanke;
        });
      } else {
        const monthMap = {};
        weeklyData.forEach(d => {
          const major = getMajorMonth(d.week_start_date);
          const key = major.key;
          if (!monthMap[key]) {
            monthMap[key] = { year: major.year, month: major.month, linan: 0, nanke: 0, linanVisits: 0, nankeVisits: 0, notes: [] };
          }
          monthMap[key].linan += Number(d.linan_amount || 0);
          monthMap[key].nanke += Number(d.nanke_amount || 0);
          
          const counts = getVisitCounts(d.week_start_date, d.week_end_date);
          monthMap[key].linanVisits += (counts.linan === '-' ? 0 : counts.linan);
          monthMap[key].nankeVisits += (counts.nanke === '-' ? 0 : counts.nanke);

          if (d.note) monthMap[key].notes.push(d.note);
        });

        chartData = Object.keys(monthMap).sort().map(k => ({
          key: k, ...monthMap[k], noteStr: monthMap[k].notes.join("、") || null
        }));
        labels    = chartData.map(d => `${d.year}/${d.month}月`);
        linanData = chartData.map(d => d.linan);
        nankeData = chartData.map(d => d.nanke);
        linanVisitsData = chartData.map(d => d.linanVisits);
        nankeVisitsData = chartData.map(d => d.nankeVisits);
      }

      // 計算全局最大值，鎖定 Y 軸高度防止跳動
      const maxSales = Math.max(...linanData, ...nankeData, 100000);
      const maxVisits = Math.max(...linanVisitsData, ...nankeVisitsData, 10);

      const ctx = document.getElementById("mainChart").getContext("2d");
      if (performanceChart) performanceChart.destroy();
      Chart.register(window.ChartZoom);

      performanceChart = new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: [
            { label: "臨安店", data: linanData, borderColor: "#FF0088", backgroundColor: "rgba(255, 0, 136, 0.12)", borderWidth: 2.2, tension: 0.35, pointRadius: 2, pointHoverRadius: 5, yAxisID: "y", hidden: !dom.toggleLinanSales.checked },
            { label: "南科店", data: nankeData, borderColor: "#FFB3FF", backgroundColor: "rgba(255, 179, 255, 0.10)", borderWidth: 2.2, tension: 0.35, pointRadius: 2, pointHoverRadius: 5, yAxisID: "y", hidden: !dom.toggleNankeSales.checked },
            { label: "臨安來客數", data: linanVisitsData, borderColor: "#00ffff", backgroundColor: "rgba(0, 255, 255, 0.1)", borderWidth: 2, tension: 0.35, pointRadius: 2, pointHoverRadius: 5, yAxisID: "y2", hidden: !dom.toggleLinanVisits.checked },
            { label: "南科來客數", data: nankeVisitsData, borderColor: "#39ff14", backgroundColor: "rgba(57, 255, 20, 0.1)", borderWidth: 2, tension: 0.35, pointRadius: 2, pointHoverRadius: 5, yAxisID: "y2", hidden: !dom.toggleNankeVisits.checked }
          ]
        },
        options: {
          responsive: true, 
          maintainAspectRatio: false, 
          interaction: { mode: "index", intersect: false },
          animation: {
            duration: 750,
            easing: 'easeInOutQuart'
          },
          plugins: {
            legend: { display: false }, // 關閉預設圖例，改用自訂 Checkbox
            tooltip: {
              backgroundColor: "rgba(15, 23, 42, 0.92)", titleColor: "#fff", bodyColor: "#ffffff", borderColor: "#334155", borderWidth: 1,
              callbacks: {
                label: (context) => {
                  const label = context.dataset.label || "";
                  const val = context.parsed.y ?? 0;
                  let base = "";
                  if (label.includes("來客數")) base = `${label}: ${val} 人`;
                  else base = `${label}: ${fmtTwd(val)}`;
                  
                  const row = chartData[context.dataIndex] || {};
                  const note = chartViewMode === "weekly" ? row.note : row.noteStr;
                  return note ? `${base}（${note}）` : base;
                }
              }
            },
            zoom: { pan: { enabled: true, mode: "x" }, zoom: { wheel: { enabled: false }, pinch: { enabled: false }, mode: "x" } }
          },
          scales: {
            y: { min: 0, suggestedMax: maxSales * 1.1, grid: { color: "#334155" }, ticks: { color: "#ffffff", callback: (v) => (v >= 10000 ? `${Math.round(v / 10000)}萬` : v) } },
            y2: { min: 0, suggestedMax: maxVisits * 1.2, display: false, position: "right", grid: { drawOnChartArea: false } },
            x:  { grid: { display: false }, ticks: { color: "#ffffff", maxTicksLimit: 10 } }
          }
        }
      });

      if (performanceChart.getInitialScaleBounds) {
        chartXOriginal = performanceChart.getInitialScaleBounds().x;
      } else {
        chartXOriginal = { min: performanceChart.scales.x.min, max: performanceChart.scales.x.max };
      }

      const canvas = performanceChart.canvas;
      canvas.onmousemove = (e) => {
        const rect = canvas.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const area = performanceChart.chartArea;
        if (px < area.left || px > area.right) return;
        hoverXRatio = Math.min(1, Math.max(0, (px - area.left) / (area.right - area.left)));
        hoverXValue = performanceChart.scales.x.getValueForPixel(px);
      };
      canvas.onmouseleave = () => { hoverXValue = null; hoverXRatio = 0.5; };
    }

    function renderKPI() {
      const elTotal = document.getElementById("kpiTotal"), elLinan = document.getElementById("kpiLinan"), elNanke = document.getElementById("kpiNanke"), elGrowth = document.getElementById("kpiGrowth"), wrap = document.getElementById("kpiGrowthWrap"), elVisit = document.getElementById("kpiVisitCount");
      const weeklyRows = allData.filter(d => d.period_type === "weekly" && d.week_start_date);
      
      if (!weeklyRows.length) {
        elTotal.textContent = "--"; elLinan.textContent = "--"; elNanke.textContent = "--"; elGrowth.textContent = "--";
        elVisit.textContent = "來客數：-- / -- 人";
        elGrowth.className = "text-white"; wrap.className = "mt-2 text-xs flex items-center"; return;
      }

      const sorted = [...weeklyRows].sort((a, b) => parseISODateLocal(a.week_start_date).getTime() - parseISODateLocal(b.week_start_date).getTime());
      const latest = sorted[sorted.length - 1];
      const prev = sorted.length > 1 ? sorted[sorted.length - 2] : null;

      const total = Number(latest.linan_amount || 0) + Number(latest.nanke_amount || 0);
      elTotal.textContent = fmtTwd(total);
      elLinan.textContent = (Number(latest.linan_amount || 0) / 10000).toFixed(1);
      elNanke.textContent = (Number(latest.nanke_amount || 0) / 10000).toFixed(1);

      // 計算最新週來客數
      const counts = getVisitCounts(latest.week_start_date, latest.week_end_date);
      elVisit.innerHTML = `來客數：<span class="text-[#00ffff]">${counts.linan}</span> / <span class="text-[#39ff14]">${counts.nanke}</span> 人`;

      if (!prev || !(Number(prev.linan_amount || 0) + Number(prev.nanke_amount || 0))) {
        wrap.className = "mt-2 text-xs flex items-center text-white"; elGrowth.className = "text-white"; elGrowth.textContent = "無上週比較資料"; return;
      }

      const prevTotal = Number(prev.linan_amount || 0) + Number(prev.nanke_amount || 0);
      const growth = ((total - prevTotal) / prevTotal) * 100;
      const up = growth >= 0;
      const colorClass = up ? "text-emerald-400" : "text-rose-400";
      wrap.className = `mt-2 text-xs flex items-center ${colorClass}`;
      elGrowth.className = colorClass;
      elGrowth.innerHTML = `${up ? '<i class="fas fa-arrow-up mr-1"></i>' : '<i class="fas fa-arrow-down mr-1"></i>'}${growth.toFixed(1)}% 較上週`;
    }

    function saveExpandedState() {
      localStorage.setItem('expandedGroups', JSON.stringify([...expandedGroups]));
    }

    window.toggleGroup = function(key) {
      if (expandedGroups.has(key)) expandedGroups.delete(key);
      else expandedGroups.add(key);
      saveExpandedState();
      renderTable();
    };

    // ===== 資料群組化邏輯 (固定升冪：舊到新) =====
    function groupData(data) {
      const groups = {};
      data.forEach(row => {
        let y, m, groupKey, isHistorical;

        if (row.period_type === "weekly" && row.week_start_date) {
          const major = getMajorMonth(row.week_start_date);
          y = major.year; m = major.month;
        } else {
          y = row.year; m = row.month;
        }

        // 歷史資料判定：2025年6月(含)以前
        isHistorical = (y < 2025) || (y === 2025 && m <= 6);
        groupKey = isHistorical ? "historical" : `${y}-${String(m).padStart(2, '0')}`;

        if (!groups[groupKey]) {
          groups[groupKey] = {
            key: groupKey, isHistorical, year: y, month: m,
            title: isHistorical ? "2025年6月以前 (歷史資料)" : `${y}/${m}月`,
            rows: [], totalLinan: 0, totalNanke: 0, totalLinanVisits: 0, totalNankeVisits: 0
          };
        }

        groups[groupKey].rows.push(row);
        groups[groupKey].totalLinan += Number(row.linan_amount || 0);
        groups[groupKey].totalNanke += Number(row.nanke_amount || 0);
        
        const counts = getVisitCounts(row.week_start_date, row.week_end_date);
        groups[groupKey].totalLinanVisits += (counts.linan === '-' ? 0 : counts.linan);
        groups[groupKey].totalNankeVisits += (counts.nanke === '-' ? 0 : counts.nanke);
      });

      // 群組內按時間排序 (舊到新)
      Object.values(groups).forEach(g => {
        g.rows.sort((a, b) => {
          const ta = a.week_start_date ? parseISODateLocal(a.week_start_date).getTime() : new Date(a.year, a.month-1, 1).getTime();
          const tb = b.week_start_date ? parseISODateLocal(b.week_start_date).getTime() : new Date(b.year, b.month-1, 1).getTime();
          return ta - tb;
        });
      });

      // 群組間排序 (固定升冪：舊到新)
      let groupArr = Object.values(groups);
      groupArr.sort((a, b) => {
        if (a.isHistorical && !b.isHistorical) return -1;
        if (!a.isHistorical && b.isHistorical) return 1;
        if (a.isHistorical && b.isHistorical) return 0;
        const valA = a.year * 100 + a.month;
        const valB = b.year * 100 + b.month;
        return valA - valB;
      });

      return groupArr;
    }

    // ===== 渲染表格 (PDF 佈局 + 來客數) =====
    function renderTable() {
      const grouped = groupData(allData);
      dom.tbody.innerHTML = "";

      grouped.forEach(group => {
        const isExpanded = expandedGroups.has(group.key);
        const rowCount = group.rows.length;

        if (!isExpanded) {
          // 收折狀態：顯示單列總計
          const tr = document.createElement("tr");
          tr.className = "border-b border-slate-700/50 hover:bg-slate-700/30 transition cursor-pointer bg-slate-800/30";
          tr.onclick = () => toggleGroup(group.key);
          tr.innerHTML = `
            <td class="px-4 py-3 text-center border-r border-slate-700/50 font-bold text-white">
              <i class="fas fa-plus-square text-blue-400 mr-2"></i>${group.title}
            </td>
            <td class="px-4 py-3 text-center border-r border-slate-700/50 text-white">共 ${rowCount} ${group.isHistorical ? '個月' : '週'}</td>
            <td class="px-4 py-3 text-center border-r border-slate-700/50 text-white">-</td>
            <td class="px-4 py-3 text-right border-r border-slate-700/50 font-mono text-[#FF0088] font-bold">${fmtNum(group.totalLinan)}</td>
            <td class="px-4 py-3 text-center border-r border-slate-700/50 text-white">-</td>
            <td class="px-4 py-3 text-right border-r border-slate-700/50 font-mono text-[#FFB3FF] font-bold">${fmtNum(group.totalNanke)}</td>
            <td class="px-4 py-3 text-center border-r border-slate-700/50 font-mono text-sm"><span class="text-[#00ffff]">${group.totalLinanVisits}</span><span class="text-white mx-1">/</span><span class="text-[#39ff14]">${group.totalNankeVisits}</span></td>
            <td class="px-4 py-3 text-center text-white">-</td>
          `;
          dom.tbody.appendChild(tr);
        } else {
          // 展開狀態
          if (group.isHistorical) {
            // 歷史資料：逐月顯示，無 rowspan
            group.rows.forEach((row, i) => {
              const tr = document.createElement("tr");
              tr.className = "border-b border-slate-700/50 hover:bg-slate-700/30 transition";
              
              let monthCell = '';
              if (i === 0) {
                monthCell = `<td class="px-4 py-3 text-center border-r border-slate-700/50 font-bold text-white cursor-pointer hover:text-gray-300" onclick="event.stopPropagation(); toggleGroup('${group.key}')">
                  <i class="fas fa-minus-square text-blue-400 mr-2"></i>${row.year}/${row.month}月
                </td>`;
              } else {
                monthCell = `<td class="px-4 py-3 text-center border-r border-slate-700/50 text-white">${row.year}/${row.month}月</td>`;
              }

              tr.innerHTML = `
                ${monthCell}
                <td class="px-4 py-3 text-center border-r border-slate-700/50 bg-black/40 text-white text-xs">無週資料</td>
                <td class="px-4 py-3 text-center border-r border-slate-700/50 text-white">-</td>
                <td class="px-4 py-3 text-right border-r border-slate-700/50 font-mono text-[#FF0088]">${fmtNum(row.linan_amount)}</td>
                <td class="px-4 py-3 text-center border-r border-slate-700/50 text-white">-</td>
                <td class="px-4 py-3 text-right border-r border-slate-700/50 font-mono text-[#FFB3FF]">${fmtNum(row.nanke_amount)}</td>
                <td class="px-4 py-3 text-center border-r border-slate-700/50 text-white">-</td>
                <td class="px-4 py-3 text-center text-yellow-400 font-bold text-xs tracking-wide">${row.note || ''}</td>
              `;
              
              if (isAdmin) {
                tr.classList.add("cursor-pointer");
                tr.onclick = (e) => { if (!e.target.closest('.fa-minus-square')) openModal(row); };
              }
              dom.tbody.appendChild(tr);
            });
          } else {
            // 正常月份：使用 Rowspan 合併總計
            group.rows.forEach((row, i) => {
              const tr = document.createElement("tr");
              tr.className = "border-b border-slate-700/50 hover:bg-slate-700/30 transition";

              const s = parseISODateLocal(row.week_start_date);
              const e = addDays(s, 6);
              const periodStr = `${s.getMonth()+1}/${s.getDate()} - ${e.getMonth()+1}/${e.getDate()}`;
              
              // 計算該週來客數
              const counts = getVisitCounts(row.week_start_date, row.week_end_date);

              let html = '';
              if (i === 0) {
                html += `
                  <td rowspan="${rowCount}" class="px-4 py-3 text-center border-r border-slate-700/50 font-bold text-white align-top pt-4 cursor-pointer hover:text-gray-300 bg-slate-800/10" onclick="event.stopPropagation(); toggleGroup('${group.key}')">
                    <i class="fas fa-minus-square text-blue-400 mr-2"></i><br>${group.title}
                  </td>
                `;
              }

              html += `<td class="px-4 py-3 text-center border-r border-slate-700/50 text-white text-xs">${periodStr}</td>`;
              html += `<td class="px-4 py-3 text-right border-r border-slate-700/50 font-mono text-[#FF0088]">${fmtNum(row.linan_amount)}</td>`;

              if (i === 0) {
                html += `<td rowspan="${rowCount}" class="px-4 py-3 text-right border-r border-slate-700/50 font-mono text-[#FF0088] font-bold align-top pt-4 bg-slate-800/10">${fmtNum(group.totalLinan)}</td>`;
              }

              html += `<td class="px-4 py-3 text-right border-r border-slate-700/50 font-mono text-[#FFB3FF]">${fmtNum(row.nanke_amount)}</td>`;

              if (i === 0) {
                html += `<td rowspan="${rowCount}" class="px-4 py-3 text-right border-r border-slate-700/50 font-mono text-[#FFB3FF] font-bold align-top pt-4 bg-slate-800/10">${fmtNum(group.totalNanke)}</td>`;
              }

              // 來客數欄位
              html += `<td class="px-4 py-3 text-center border-r border-slate-700/50 font-mono text-sm"><span class="text-[#00ffff]">${counts.linan}</span><span class="text-white mx-1">/</span><span class="text-[#39ff14]">${counts.nanke}</span></td>`;
              
              html += `<td class="px-4 py-3 text-center text-yellow-400 font-bold text-xs tracking-wide">${row.note || ''}</td>`;

              tr.innerHTML = html;

              if (isAdmin) {
                tr.classList.add("cursor-pointer");
                tr.onclick = (e) => {
                  if (!e.target.closest('td[rowspan]')) openModal(row);
                };
              }
              dom.tbody.appendChild(tr);
            });
          }
        }
      });
    }

    function openModal(row) {
      if (!isAdmin) return;
      dom.entryModal.classList.remove("hidden");
      dom.performanceForm.reset();

      if (row) {
        dom.editId.value = row.id;
        dom.inputDate.value = row.week_start_date || "";
        dom.inputLinan.value = row.linan_amount ?? 0;
        dom.inputNanke.value = row.nanke_amount ?? 0;
        dom.inputNote.value = row.note ?? "";
        dom.btnDeleteEntry.classList.remove("hidden");
        if (row.week_start_date) showWeekRangeText(row.week_start_date);
      } else {
        dom.editId.value = "";
        const today = new Date().toISOString().slice(0, 10);
        dom.inputDate.value = today;
        dom.btnDeleteEntry.classList.add("hidden");
        showWeekRangeText(today);
      }
    }

    function closeModal() { dom.entryModal.classList.add("hidden"); }

    async function handleDelete() {
      const id = dom.editId.value;
      if (!id) return;

      const result = await Swal.fire({
        title: '確定要刪除嗎？',
        text: "刪除後將無法復原！",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#334155',
        confirmButtonText: '是的，刪除',
        cancelButtonText: '取消',
        background: '#1e293b',
        color: '#fff'
      });

      if (result.isConfirmed) {
        const { error } = await supabase.from('sales_performance').delete().eq('id', id);
        if (error) {
          Swal.fire({ icon: "error", title: "刪除失敗", text: error.message, background: "#1e293b", color: "#fff" });
        } else {
          closeModal();
          Swal.fire({ icon: "success", title: "已刪除", timer: 900, showConfirmButton: false, background: "#1e293b", color: "#fff" });
          await refreshData();
        }
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      if (!isAdmin) return;

      const dateIso = dom.inputDate.value;
      if (!dateIso) return;

      const r = getWeekRange(dateIso);
      const major = getMajorMonth(toISODateLocal(r.start));

      const payload = {
        period_type: "weekly",
        year: major.year,
        month: major.month,
        week_start_date: toISODateLocal(r.start),
        week_end_date: toISODateLocal(r.end),
        linan_amount: Number(dom.inputLinan.value || 0),
        nanke_amount: Number(dom.inputNanke.value || 0),
        note: (dom.inputNote.value || "").trim() || null,
        updated_at: new Date().toISOString()
      };

      const id = (dom.editId.value || "").trim();
      let error = null;

      if (id) {
        const res = await supabase.from("sales_performance").update(payload).eq("id", id);
        error = res.error;
      } else {
        const res = await supabase.from("sales_performance").insert([payload]);
        error = res.error;
      }

      if (error) {
        Swal.fire({ icon: "error", title: "儲存失敗", text: error.message, background: "#1e293b", color: "#fff" });
        return;
      }

      closeModal();
      Swal.fire({ icon: "success", title: "儲存成功", timer: 900, showConfirmButton: false, background: "#1e293b", color: "#fff" });
      await refreshData();
    }
  </script>
</body>
</html>
