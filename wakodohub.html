  <title>WAKODO HUB｜和光堂行銷企劃部｜營運儀表板</title>
  <style>
    :root{
      --blue:#4285F4;
      --green:#34A853;
      --yellow:#FBBC05;
      --red:#EA4335;
      --ink:#252525;
      --muted:#6f716f;
      --line:rgba(34,34,34,.09);
      --shell:rgba(255,255,255,.84);
      --shadow:0 16px 42px rgba(45,49,55,.10);
      --radius:22px;
      --orange:#F97316;
      --glow-blue:rgba(66,133,244,.26);
      --glow-green:rgba(52,168,83,.24);
      --glow-orange:rgba(249,115,22,.24);
      --glow-yellow:rgba(251,188,5,.26);
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{
      overflow:hidden;
      color:var(--ink);
      font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
      background:
        radial-gradient(circle at 8% 6%,rgba(66,133,244,.13),transparent 31%),
        radial-gradient(circle at 88% 15%,rgba(52,168,83,.10),transparent 31%),
        radial-gradient(circle at 74% 94%,rgba(251,188,5,.11),transparent 34%),
        #f3f4f5;
    }
    button,input{font:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}

    /* ===== Single gate ===== */
    #hubGate{
      position:fixed;inset:0;z-index:10000;
      display:flex;align-items:center;justify-content:center;
      padding:24px;background:rgba(244,245,246,.82);
      backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    }
    .gate-card{
      width:min(440px,100%);padding:32px;
      background:rgba(255,255,255,.94);
      border:1px solid rgba(255,255,255,.95);
      border-radius:28px;box-shadow:0 26px 72px rgba(31,35,41,.17);
    }
    .gate-brand{display:flex;align-items:center;gap:11px;margin-bottom:26px}
    .gate-brand-mark{
      width:40px;height:40px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
      background:#fff;border:1px solid var(--line);
      box-shadow:0 5px 16px rgba(0,0,0,.06);
    }
    .gate-brand-name{font-size:13px;font-weight:900;letter-spacing:.8px}
    .gate-title{font-size:29px;font-weight:900;letter-spacing:-.8px;margin:0 0 8px}
    .gate-desc{margin:0 0 22px;color:var(--muted);font-size:14px;line-height:1.65;font-weight:650}
    .gate-input{
      width:100%;height:52px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);
      background:#fff;color:var(--ink);outline:none;font-size:16px;font-weight:800;letter-spacing:.8px;
      transition:.18s ease;
    }
    .gate-input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(66,133,244,.11)}
    .gate-input.error{border-color:var(--red);box-shadow:0 0 0 4px rgba(234,67,53,.09)}
    .gate-btn{
      width:100%;height:50px;margin-top:14px;border:0;border-radius:14px;
      background:var(--blue);color:#fff;font-size:15px;font-weight:900;
      box-shadow:0 8px 22px rgba(66,133,244,.26);transition:.18s ease;
    }
    .gate-btn:hover{filter:brightness(1.04);transform:translateY(-1px)}
    .gate-error{display:none;margin-top:12px;color:var(--red);font-size:13px;font-weight:800;text-align:center}
    .gate-foot{margin-top:14px;text-align:center;color:#9aa0a6;font-size:11px;font-weight:700}

    /* ===== Shell ===== */
    #hubApp{height:100%;display:grid;grid-template-rows:76px minmax(0,1fr)}
    .topbar{
      height:64px;margin:12px 14px 0;padding:9px 13px 9px 17px;
      display:grid;grid-template-columns:minmax(360px,1.2fr) auto minmax(190px,1fr);align-items:center;gap:14px;
      background:var(--shell);border:1px solid rgba(255,255,255,.94);border-radius:22px;
      box-shadow:var(--shadow);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
      position:relative;z-index:50;
    }
    .hub-brand{display:flex;align-items:center;gap:11px;min-width:0}
    .hub-logo{
      width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;
      background:transparent;border:0;overflow:visible;box-shadow:none;
    }
    .hub-logo svg,.gate-brand-mark svg{width:100%;height:100%;display:block}
    .hub-logo .wakodo-mark{padding:0}
    .gate-brand-mark .wakodo-mark{padding:4px}
    .hub-brand-copy{min-width:0}
    .hub-brand-copy strong{display:block;font-size:16px;line-height:1.1;font-weight:900;white-space:nowrap}
    .hub-brand-copy span{display:block;margin-top:4px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.35px;white-space:nowrap}

    .tabs{
      position:relative;
      display:flex;align-items:center;justify-content:center;gap:2px;
      padding:5px;border-radius:16px;
      background:rgba(70,74,80,.08);
      border:1px solid rgba(255,255,255,.70);
      box-shadow:
        inset 0 2px 6px rgba(28,32,38,.13),
        inset 0 -1px 0 rgba(255,255,255,.76),
        0 0 0 1px rgba(66,133,244,.05);
      isolation:isolate;
    }
    .tabs::before{
      content:"";position:absolute;inset:-3px;border-radius:19px;z-index:-2;pointer-events:none;
      box-shadow:0 0 13px rgba(66,133,244,.18),0 0 25px rgba(66,133,244,.10);
      animation:tabsBreath 2.8s ease-in-out infinite;
    }
    @keyframes tabsBreath{
      0%,100%{opacity:.52;filter:blur(.1px)}
      50%{opacity:1;filter:blur(.4px)}
    }
    .tab-slider{
      position:absolute;left:5px;top:5px;height:calc(100% - 10px);width:0;
      border-radius:12px;z-index:1;pointer-events:none;
      background:linear-gradient(180deg,rgba(255,255,255,.93),rgba(255,255,255,.76));
      border:1px solid rgba(255,255,255,.96);
      box-shadow:
        0 7px 16px rgba(37,43,51,.14),
        0 2px 5px rgba(37,43,51,.09),
        inset 0 1px 0 rgba(255,255,255,1),
        inset 0 -1px 0 rgba(255,255,255,.48);
      backdrop-filter:blur(14px) saturate(1.18);
      -webkit-backdrop-filter:blur(14px) saturate(1.18);
      transition:left .34s cubic-bezier(.22,.85,.28,1.08),width .34s cubic-bezier(.22,.85,.28,1.08);
    }
    .tab{
      position:relative;z-index:2;
      border:0;background:transparent;color:#656a70;border-radius:11px;
      min-height:40px;padding:8px 15px;font-size:13px;font-weight:860;white-space:nowrap;
      display:inline-flex;align-items:center;gap:8px;
      transform:translateY(0) scale(1);
      transition:color .20s ease,transform .28s cubic-bezier(.22,.85,.28,1.08),text-shadow .22s ease;
      box-shadow:none;
    }
    .tab:hover{color:#35393d}
    .tab.active{
      background:transparent;box-shadow:none;
      transform:translateY(-1.5px) scale(1.055);
      text-shadow:0 1px 0 rgba(255,255,255,.95),0 4px 12px rgba(66,133,244,.14);
    }
    .tab-dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;opacity:.66;transition:transform .28s ease,opacity .22s ease,box-shadow .22s ease}
    .tab.active .tab-dot{opacity:1;transform:scale(1.28);box-shadow:0 0 0 3px rgba(255,255,255,.64)}
    .tab[data-view="customer"] .tab-dot{background:var(--blue)}
    .tab[data-view="performance"] .tab-dot{background:var(--green)}
    .tab[data-view="marketing"] .tab-dot{background:var(--orange)}
    .tab[data-view="social"] .tab-dot{background:var(--yellow)}
    .tab[data-view="customer"].active{color:#2f6fd8}
    .tab[data-view="performance"].active{color:#188038}
    .tab[data-view="marketing"].active{color:#d97706}
    .tab[data-view="social"].active{color:#a86d00}


    .actions{display:flex;justify-content:flex-end;align-items:center;gap:8px}
    .status-pill{
      display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;
      background:rgba(52,168,83,.08);border:1px solid rgba(52,168,83,.14);color:#188038;
      font-size:10px;font-weight:900;white-space:nowrap;
    }
    .status-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
    .action-btn{
      width:38px;height:38px;padding:0;border-radius:11px;border:1px solid var(--line);
      background:#fff;color:#5f6368;display:grid;place-items:center;font-size:16px;font-weight:900;
      transition:.18s ease;box-shadow:0 2px 7px rgba(0,0,0,.035);
    }
    .action-btn:hover{color:var(--ink);transform:translateY(-1px);box-shadow:0 5px 12px rgba(0,0,0,.07)}
    .action-btn.logout:hover{color:var(--red)}

    .workspace{
      min-height:0;position:relative;margin:12px 14px 14px;border-radius:24px;overflow:hidden;
      background:#fff;border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow);
    }
    .view{position:absolute;inset:0;background:#fff;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .16s ease}
    .view.active{opacity:1;visibility:visible;pointer-events:auto}
    .view iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .loading{
      position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:#fff;color:var(--muted);
      font-size:13px;font-weight:850;
    }
    .loading-inner{text-align:center}
    .spinner{width:30px;height:30px;margin:0 auto 12px;border:3px solid #e9eaec;border-top-color:var(--blue);border-radius:50%;animation:spin .75s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .toast{
      position:fixed;left:50%;bottom:24px;z-index:2000;transform:translate(-50%,16px);
      opacity:0;pointer-events:none;padding:10px 14px;border-radius:11px;background:#202124;color:#fff;
      box-shadow:0 10px 30px rgba(0,0,0,.2);font-size:12px;font-weight:800;transition:.2s ease;
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}

    @media(max-width:1050px){
      .topbar{grid-template-columns:auto minmax(0,1fr) auto}
      .hub-brand-copy span,.status-pill{display:none}
      .tabs{justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
      .tabs::-webkit-scrollbar{display:none}
      .tab{padding:8px 12px}
    }
    @media(max-width:720px){
      #hubApp{grid-template-rows:68px minmax(0,1fr)}
      .topbar{height:60px;margin:8px 8px 0;padding:7px 9px;gap:8px;border-radius:18px}
      .workspace{margin:8px;border-radius:20px}
      .hub-brand-copy{display:none}
      .hub-logo{width:38px;height:38px;flex-basis:38px}
      .tabs{gap:3px;padding:3px}
      .tab{min-height:38px;padding:7px 10px;font-size:12px}
      .tab-dot{display:none}
      .action-btn.open-new{display:none}
    }
    @media(max-width:500px){
      .topbar{grid-template-columns:auto minmax(0,1fr) auto}
      .action-btn.reload{display:none}
      .tab{padding:7px 8px;font-size:11px}
    }
  </style>
</head>
<body>
  <div id="hubGate">

  <script>
    const HUB = Object.freeze({
      PASSWORD: "wakodo100",
      KEY: "wakodo_hub_access_v1",
      SESSION_KEY: "wakodo_hub_session_v1",
      TTL: 48 * 60 * 60 * 1000,
      PAGES: {
        customer: { label: "客源分析", src: "index.html" },
        performance: { label: "業績分析", src: "performance.html" },
        marketing: { label: "行銷開支分析", src: "marketing.html" },
        social: { label: "社群發文成效分析", src: "social-analytics.html" }
      }
    });

    const state = { active: "customer", loaded: new Set() };
    const $ = id => document.getElementById(id);
    const qa = sel => Array.from(document.querySelectorAll(sel));

    function showToast(text){
      const el = $("hubToast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove("show"), 1600);
    }

    function readHubAccess(){
      try{
        if (sessionStorage.getItem(HUB.SESSION_KEY) === "1") {
          return { ok:true, expire:Date.now() + HUB.TTL };
        }
        const raw = localStorage.getItem(HUB.KEY);
        if (!raw) return { ok:false, expire:0 };
        const data = JSON.parse(raw);
        if (!data || !Number(data.expire) || Date.now() >= Number(data.expire)){
          localStorage.removeItem(HUB.KEY);
          return { ok:false, expire:0 };
        }
        return { ok:true, expire:Number(data.expire) };
      }catch{
        return { ok:false, expire:0 };
      }
    }

    function grantChildAccess(expire){
      const now = Date.now();
      const sharedExpire = Number(expire) > now ? Number(expire) : now + HUB.TTL;
      try{
        /* index.html：48 小時時間戳機制 */
        const indexGrantedAt = sharedExpire - HUB.TTL;
        sessionStorage.setItem("wakodo_gate_ok", "1");
        localStorage.setItem("wakodo_gate_ok_time", String(indexGrantedAt));

        /* performance.html：JSON expire 機制 */
        localStorage.setItem("wakodo_perf_front_access_v3", JSON.stringify({ expire:sharedExpire }));

        /* marketing.html：JSON expire 機制 */
        localStorage.setItem("wakodo_mkt_access_v3", JSON.stringify({ expire:sharedExpire }));
      }catch(err){
        console.warn("WAKODO HUB 無法同步子頁登入狀態", err);
      }
    }

    function clearAllAccess(){
      try{
        sessionStorage.removeItem(HUB.SESSION_KEY);
        localStorage.removeItem(HUB.KEY);
        sessionStorage.removeItem("wakodo_gate_ok");
        localStorage.removeItem("wakodo_gate_ok_time");
        localStorage.removeItem("wakodo_perf_front_access_v3");
        localStorage.removeItem("wakodo_mkt_access_v3");
      }catch{}
    }

    function enterHub(){
      const input = $("hubPassword");
      const err = $("hubGateError");
      if (input.value !== HUB.PASSWORD){
        input.classList.add("error");
        err.style.display = "block";
        input.value = "";
        input.focus();
        return;
      }
      const expire = Date.now() + HUB.TTL;
      sessionStorage.setItem(HUB.SESSION_KEY, "1");
      localStorage.setItem(HUB.KEY, JSON.stringify({ expire }));
      grantChildAccess(expire);
      input.classList.remove("error");
      err.style.display = "none";
      showHub();
    }

    function showHub(){
      const access = readHubAccess();
      if (!access.ok) return showGate();
      grantChildAccess(access.expire);
      $("hubGate").style.display = "none";
      $("hubApp").classList.remove("hidden");
      const target = normalizeHash(location.hash);
      switchView(target, false);
    }

    function showGate(){
      $("hubApp").classList.add("hidden");
      $("hubGate").style.display = "flex";
      setTimeout(() => $("hubPassword").focus(), 0);
    }

    function normalizeHash(hash){
      const key = String(hash || "").replace(/^#/, "");
      return HUB.PAGES[key] ? key : "customer";
    }

    function loadView(name){
      if (state.loaded.has(name)) return;
      const panel = document.querySelector(`[data-view-panel="${name}"]`);
      if (!panel) return;
      const frame = panel.querySelector("iframe");
      const loading = panel.querySelector(".loading");
      frame.addEventListener("load", () => {
        if (loading) loading.style.display = "none";
        /* 子頁載入時可能自行延長原本的記住期限，HUB 再同步回目前 HUB 權限 */
        const access = readHubAccess();
        if (access.ok) grantChildAccess(access.expire);
      }, { once:true });
      frame.src = HUB.PAGES[name].src;
      state.loaded.add(name);
    }

    function syncTabSlider(name=state.active, scrollIntoView=false){
      const tabs = document.querySelector(".tabs");
      const slider = document.querySelector(".tab-slider");
      const active = document.querySelector(`.tab[data-view="${name}"]`);
      if (!tabs || !slider || !active) return;
      slider.style.width = active.offsetWidth + "px";
      slider.style.left = active.offsetLeft + "px";
      if (scrollIntoView && typeof active.scrollIntoView === "function") {
        active.scrollIntoView({ behavior:"smooth", block:"nearest", inline:"center" });
      }
    }

    function switchView(name, updateHash=true){
      if (!HUB.PAGES[name]) name = "customer";
      state.active = name;
      qa(".tab").forEach(btn => btn.classList.toggle("active", btn.dataset.view === name));
      requestAnimationFrame(() => syncTabSlider(name, true));
      qa(".view").forEach(panel => panel.classList.toggle("active", panel.dataset.viewPanel === name));
      loadView(name);
      if (updateHash && location.hash !== `#${name}`) history.replaceState(null, "", `#${name}`);
      document.title = `${HUB.PAGES[name].label}｜WAKODO HUB`;
    }

    qa(".tab").forEach(btn => btn.addEventListener("click", () => switchView(btn.dataset.view)));
    $("hubEnter").addEventListener("click", enterHub);
    $("hubPassword").addEventListener("keydown", e => { if (e.key === "Enter") enterHub(); });
    $("hubPassword").addEventListener("input", () => { $("hubPassword").classList.remove("error"); $("hubGateError").style.display = "none"; });

    $("reloadCurrent").addEventListener("click", () => {
      const panel = document.querySelector(`[data-view-panel="${state.active}"]`);
      const frame = panel && panel.querySelector("iframe");
      const loading = panel && panel.querySelector(".loading");
      if (!frame || !frame.src) return;
      if (loading) loading.style.display = "grid";
      try{ frame.contentWindow.location.reload(); }
      catch{ frame.src = frame.src; }
      setTimeout(() => { if (loading) loading.style.display = "none"; }, 2500);
    });

    $("openCurrent").addEventListener("click", () => {
      const page = HUB.PAGES[state.active];
      if (page) window.open(page.src, "_blank", "noopener");
    });

    $("hubLogout").addEventListener("click", () => {
      clearAllAccess();
      state.loaded.forEach(name => {
        const panel = document.querySelector(`[data-view-panel="${name}"]`);
        const frame = panel && panel.querySelector("iframe");
        const loading = panel && panel.querySelector(".loading");
        if (frame) frame.removeAttribute("src");
        if (loading) loading.style.display = "grid";
      });
      state.loaded.clear();
      $("hubPassword").value = "";
      showGate();
      showToast("已登出 WAKODO HUB");
    });

    window.addEventListener("hashchange", () => {
      if (readHubAccess().ok) switchView(normalizeHash(location.hash), false);
    });

    window.addEventListener("resize", () => {
      requestAnimationFrame(() => syncTabSlider(state.active, false));
    });

    window.addEventListener("load", () => {
      const access = readHubAccess();
      if (access.ok) showHub();
      else showGate();
      requestAnimationFrame(() => syncTabSlider(state.active, false));
    });
  </script>
</body>
</html>
