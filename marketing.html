  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const SUPABASE_URL = "https://yxalpzculcyhzvnyvecb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_NqpdQeAYGWTFBcdjkAQ4eQ_AT2GXf5k";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const FRONT_PASS = "wakodo1000";
    const FRONT_KEY  = "wakodo_mkt_access_v3";
    const FRONT_TTL  = 7 * 24 * 60 * 60 * 1000;

    // ─── 1. 全域變數狀態宣告（統一狀態，拒絕變數衝突） ───
    let _sessionUnlocked = false; 
    let isEditMode = false;
    let allSales = [];
    let allExpenses = [];
    let allMonthKeys = [];
    const expandedGroups = new Set();
    let currentFocusMonth = null;

    // ─── 2. DOM 節點物件 ───
    const dom = {
      lockScreen: document.getElementById("lockScreen"),
      accessPassword: document.getElementById("accessPassword"),
      btnEnter: document.getElementById("btnEnter"),
      btnToggleMode: document.getElementById("btnToggleMode"),
      btnShowLogs: document.getElementById("btnShowLogs"),
      monthlyContainer: document.getElementById("monthlyContainer"),
      summaryTotal: document.getElementById("summaryTotal"),
      summaryDaily: document.getElementById("summaryDaily"),
      summaryMonthLabel: document.getElementById("summaryMonthLabel"),
      btnExpandAll: document.getElementById("btnExpandAll"),
      btnCollapseAll: document.getElementById("btnCollapseAll"),
      expenseModal: document.getElementById("expenseModal"),
      expenseForm: document.getElementById("expenseForm"),
      expenseModalTitle: document.getElementById("expenseModalTitle"),
      editExpenseId: document.getElementById("editExpenseId"),
      inputYear: document.getElementById("inputYear"),
      inputMonth: document.getElementById("inputMonth"),
      inputAmount: document.getElementById("inputAmount"),
      inputDescription: document.getElementById("inputDescription"),
      inputLinanRatio: document.getElementById("inputLinanRatio"),
      ratioDisplay: document.getElementById("ratioDisplay"),
      logsModal: document.getElementById("logsModal"),
      logsContainer: document.getElementById("logsContainer")
    };

    // ─── 3. 頂層集中 Window 掛載（優先編譯，杜絕 "not defined" 的時序錯誤） ───
    window.openExpenseModal = openExpenseModal;
    window.closeExpenseModal = closeExpenseModal;
    window.editExpense = editExpense;
    window.deleteExpense = deleteExpense;
    window.openLogsModal = openLogsModal;
    window.closeLogsModal = closeLogsModal;

    // 初始化年份選單
    const thisYear = new Date().getFullYear();
    for(let y = thisYear - 1; y <= thisYear + 1; y++) {
      const opt = document.createElement("option");
      opt.value = y; opt.textContent = `${y} 年`;
      if(y === thisYear) opt.selected = true;
      dom.inputYear.appendChild(opt);
    }

    // ─── 4. 工具與計算函式 ───
    function fmtTwd(n) { return new Intl.NumberFormat("zh-TW", { style: "currency", currency: "TWD", maximumFractionDigits: 0 }).format(Number(n || 0)); }
    function getDaysInMonth(year, month) { return new Date(year, month, 0).getDate(); }
    function parseISODateLocal(dateStr){
      const [y, m, d] = String(dateStr).split("-").map(Number);
      return new Date(y, m - 1, d || 1);
    }
    function toISODateLocal(dt){ return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`; }
    function addDays(dt, days){ const x = new Date(dt); x.setDate(x.getDate() + days); return x; }

    function getMajorMonth(isoDateStr) {
      const wkStart = parseISODateLocal(isoDateStr);
      const counts = new Map();
      for (let i = 0; i < 7; i++) {
        const x = addDays(wkStart, i);
        const key = `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}`;
        counts.set(key, (counts.get(key) || 0) + 1);
      }
      let bestKey = null, bestDays = -1;
      for (const [k, days] of counts.entries()) {
        if (days > bestDays) { bestDays = days; bestKey = k; continue; }
        if (days === bestDays && bestKey && k > bestKey) bestKey = k;
      }
      const [yy, mm] = String(bestKey).split("-");
      return { year: Number(yy), month: Number(mm), key: bestKey };
    }

    function updateRatioDisplay(val) {
      const linan = parseInt(val);
      dom.ratioDisplay.textContent = `${linan}% : ${100 - linan}%`;
    }

    function handleDateChangeToInherit() {
      if (dom.editExpenseId.value !== "") return;
      const val = Math.round(inheritRatio(parseInt(dom.inputYear.value), parseInt(dom.inputMonth.value)) * 100);
      dom.inputLinanRatio.value = val;
      updateRatioDisplay(val);
    }

    function inheritRatio(year, month) {
      let prevMonth = month - 1, prevYear = year;
      if (prevMonth === 0) { prevMonth = 12; prevYear = year - 1; }
      const exactMatch = allExpenses.find(e => e.year === prevYear && e.month === prevMonth);
      if (exactMatch && exactMatch.linan_ratio != null) return Number(exactMatch.linan_ratio);
      if (allExpenses.length > 0) {
        const sorted = [...allExpenses].sort((a,b) => (b.year * 12 + b.month) - (a.year * 12 + a.month));
        if (sorted[0] && sorted[0].linan_ratio != null) return Number(sorted[0].linan_ratio);
      }
      return 0.72;
    }

    // ─── 5. 密碼保護機制（安全 Try-Catch 容錯模式） ───
    function setAccess() { 
      _sessionUnlocked = true;
      try { 
        localStorage.setItem(FRONT_KEY, JSON.stringify({ expire: Date.now() + FRONT_TTL })); 
      } catch (e) {
        console.warn("LocalStorage 寫入受阻，已切換至記憶體會話驗證機制");
      }
    }
    
    function checkAccess() {
      if (_sessionUnlocked) return true;
      try {
        const raw = localStorage.getItem(FRONT_KEY);
        if (!raw) return false;
        const obj = JSON.parse(raw);
        if (!obj?.expire || Date.now() > obj.expire) return false;
        _sessionUnlocked = true;
        return true;
      } catch (e) { 
        return false; 
      }
    }

    // 啟動檢測流程
    if (checkAccess()) {
      dom.lockScreen.classList.add("hidden");
      initApp();
    } else {
      dom.lockScreen.classList.remove("hidden");
      dom.accessPassword.focus();
    }

    dom.btnEnter.addEventListener("click", doUnlock);
    dom.accessPassword.addEventListener("keydown", (e) => { if (e.key === "Enter") doUnlock(); });

    function doUnlock() {
      const val = dom.accessPassword.value.trim();
      if (val !== FRONT_PASS) {
        Swal.fire({ icon: "error", title: "密碼錯誤", text: "請輸入正確的前台密碼！", background: "#FFFFFF", color: "#1F1F1F" });
        return;
      }
      setAccess();
      dom.lockScreen.classList.add("hidden");
      initApp();
    }

    // ===== 6. 系統啟動進入點（帶有全域 Swal 回報機制） =====
    async function initApp() {
      try {
        bindEvents();
        await refreshData();
        if (allMonthKeys.length > 0) {
          expandedGroups.add(allMonthKeys[0]); // 預設打開最新月份
          currentFocusMonth = allMonthKeys[0];
        }
        renderAll();
      } catch (err) {
        console.error("系統啟動失敗:", err);
        Swal.fire({ icon: "error", title: "系統啟動失敗", text: err.message || err, background: "#FFFFFF", color: "#1F1F1F" });
      }
    }

    // ===== 7. DOM 事件綁定（完美對接 onSubmit 接口） =====
    function bindEvents() {
      dom.btnToggleMode.addEventListener("click", () => {
        isEditMode = !isEditMode;
        if(isEditMode) {
          dom.btnToggleMode.innerHTML = `<i class="fas fa-check text-green-500"></i> <span>結束編輯</span>`;
          dom.btnToggleMode.className = "text-xs font-bold text-green-700 bg-green-50 hover:bg-green-100 px-4 py-1.5 rounded-lg border border-green-200 transition shadow-sm flex items-center gap-1.5";
        } else {
          dom.btnToggleMode.innerHTML = `<i class="fas fa-edit text-slate-400"></i> <span>進入編輯</span>`;
          dom.btnToggleMode.className = "text-xs font-bold text-slate-700 bg-white hover:bg-slate-50 px-4 py-1.5 rounded-lg border border-slate-200 transition shadow-sm flex items-center gap-1.5";
        }
        renderAll();
      });

      dom.btnShowLogs.addEventListener("click", openLogsModal);
      dom.btnExpandAll.addEventListener("click", () => { allMonthKeys.forEach(k => expandedGroups.add(k)); renderAll(); });
      dom.btnCollapseAll.addEventListener("click", () => { expandedGroups.clear(); renderAll(); });
      dom.inputLinanRatio.addEventListener("input", (e) => updateRatioDisplay(e.target.value));
      dom.inputYear.addEventListener("change", handleDateChangeToInherit);
      dom.inputMonth.addEventListener("change", handleDateChangeToInherit);
      
      // 綁定表單送出（修復儲存無反應之痛點）
      dom.expenseForm.addEventListener("submit", handleExpenseSubmit);
    }

    // ===== 8. 銷售與行銷數據同步撈取 =====
    async function refreshData() {
      try {
        const [salesRes, mktRes] = await Promise.all([
          supabase.from("sales_performance").select("*").eq("period_type", "weekly"),
          supabase.from("marketing_expenses").select("*")
        ]);

        if (salesRes.error) throw salesRes.error;
        if (mktRes.error) throw mktRes.error;

        allSales = salesRes.data || [];
        allExpenses = mktRes.data || [];

        const keys = new Set();
        allSales.forEach(row => { 
          if (row.week_start_date) {
            const major = getMajorMonth(row.week_start_date);
            keys.add(major.key);
          } else if (row.year && row.month) {
            keys.add(`${row.year}-${String(row.month).padStart(2, "0")}`);
          }
        });
        allExpenses.forEach(row => { 
          if (row.year && row.month) {
            keys.add(`${row.year}-${String(row.month).padStart(2, "0")}`);
          }
        });
        
        allMonthKeys = Array.from(keys).sort().reverse();
      } catch (err) {
        console.error("載入數據失敗:", err);
        Swal.fire({ icon: "error", title: "資料載入失敗", text: err.message || "連線至 Supabase 發生問題", background: "#FFFFFF", color: "#1F1F1F" });
      }
    }

    // ===== 9. 各月業績與加權分攤計算邏輯 =====
    function buildMonthlyData(key) {
      const [year, month] = key.split("-").map(Number);
      const days = getDaysInMonth(year, month);

      const expenses = allExpenses.filter(e => e.year === year && e.month === month);
      const totalExpense = expenses.reduce((sum, e) => sum + Number(e.amount || 0), 0);
      const dailyExpense = totalExpense / days;

      // 每筆費用各自套用其獨立 Linan Ratio 計算分攤
      let totalLinanExpense = 0, totalNankeExpense = 0;
      expenses.forEach(e => {
        const ratio = e.linan_ratio != null ? Number(e.linan_ratio) : 0.72;
        totalLinanExpense += Number(e.amount) * ratio;
        totalNankeExpense += Number(e.amount) * (1 - ratio);
      });

      const weeks = allSales.filter(s => s.week_start_date && getMajorMonth(s.week_start_date).key === key);
      weeks.sort((a, b) => parseISODateLocal(a.week_start_date).getTime() - parseISODateLocal(b.week_start_date).getTime());

      return { 
        key, year, month, days, expenses, totalExpense, dailyExpense,
        totalLinanExpense, totalNankeExpense,
        dailyLinanExpense: totalLinanExpense / days, dailyNankeExpense: totalNankeExpense / days,
        weeks 
      };
    }

    // ===== 10. 渲染控制（修復補回 updateSummaryCard 遺失問題） =====
    function renderAll() {
      try {
        dom.monthlyContainer.innerHTML = "";
        if(allMonthKeys.length === 0) {
          dom.monthlyContainer.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">目前無任何數據紀錄。</div>`;
          updateSummaryCard(null); return;
        }
        if(!currentFocusMonth || !allMonthKeys.includes(currentFocusMonth)) currentFocusMonth = allMonthKeys[0];
        
        updateSummaryCard(buildMonthlyData(currentFocusMonth));

        allMonthKeys.forEach(key => {
          dom.monthlyContainer.appendChild(createMonthlyCard(key));
        });
      } catch (err) {
        console.error("渲染出錯:", err);
        Swal.fire({ icon: "error", title: "畫面渲染失敗", text: err.message || err, background: "#FFFFFF", color: "#1F1F1F" });
      }
    }

    // 補回先前意外被遺留清除的 updateSummaryCard 函數本體
    function updateSummaryCard(mData) {
      if(!mData) {
        dom.summaryTotal.textContent = "--";
        dom.summaryDaily.textContent = "--";
        dom.summaryMonthLabel.textContent = ""; return;
      }
      dom.summaryTotal.textContent = fmtTwd(mData.totalExpense);
      dom.summaryDaily.textContent = fmtTwd(mData.dailyExpense);
      dom.summaryMonthLabel.textContent = `▌ ${mData.year}年 ${mData.month}月份 (${mData.days}天)`;
    }

    function createMonthlyCard(key) {
      const mData = buildMonthlyData(key);
      const isExpanded = expandedGroups.has(key);
      const div = document.createElement("div");
      div.className = "glass-panel overflow-hidden transition-all duration-300 hover:shadow-md border border-white/50";

      const header = document.createElement("div");
      header.className = "flex flex-col sm:flex-row sm:justify-between sm:items-center p-4 bg-white/40 cursor-pointer hover:bg-white/80 transition select-none gap-2";
      header.innerHTML = `
        <div class="flex items-center gap-2.5">
          <i class="fas ${isExpanded ? 'fa-chevron-down text-orange-500' : 'fa-chevron-right text-slate-400'}"></i>
          <span class="text-sm font-bold text-slate-800 flex items-center gap-1.5"><i class="far fa-calendar-alt text-[#EA580C]"></i> ${mData.year}年 ${mData.month}月份</span>
        </div>
        <div class="flex items-center gap-4 text-xs font-semibold">
          <span class="text-[#EA580C]">臨安: <strong class="font-mono">${fmtTwd(mData.totalLinanExpense)}</strong></span>
          <span class="text-blue-500">南科: <strong class="font-mono">${fmtTwd(mData.totalNankeExpense)}</strong></span>
          <span class="text-slate-400">|</span>
          <span class="text-slate-500">總支出: <strong class="text-slate-800 font-mono">${fmtTwd(mData.totalExpense)}</strong></span>
        </div>
      `;
      header.onclick = () => {
        if(expandedGroups.has(key)) expandedGroups.delete(key);
        else { expandedGroups.add(key); currentFocusMonth = key; }
        renderAll();
      };
      div.appendChild(header);

      if (isExpanded) {
        const body = document.createElement("div");
        body.className = "p-4 border-t border-slate-100 bg-white/20 space-y-5";

        // 行銷開支明細列表
        const mktSection = document.createElement("div");
        mktSection.className = "space-y-2.5";
        let mktHeadHTML = `
          <div class="flex justify-between items-center border-b border-slate-100 pb-1.5">
            <span class="text-xs font-bold text-slate-600 flex items-center gap-1"><i class="fas fa-bullhorn text-orange-500"></i> 行銷開支明細 (${mData.expenses.length} 筆)</span>
        `;
        if (isEditMode) {
          mktHeadHTML += `<button onclick="event.stopPropagation(); openExpenseModal(null, ${mData.year}, ${mData.month})" class="text-xs text-[#EA580C] font-bold">+ 新增支出</button>`;
        }
        mktHeadHTML += `</div>`;
        mktSection.innerHTML = mktHeadHTML;

        if (mData.expenses.length === 0) {
          mktSection.innerHTML += `<p class="text-xs text-slate-400 italic py-2">尚未輸入任何支出數據。</p>`;
        } else {
          const grid = document.createElement("div");
          grid.className = "grid grid-cols-1 md:grid-cols-2 gap-2";
          mData.expenses.forEach(exp => {
            const ratio = exp.linan_ratio != null ? Number(exp.linan_ratio) : 0.72;
            const row = document.createElement("div");
            row.className = "bg-white/60 rounded-xl p-3 text-xs flex justify-between items-center border border-slate-100/50";
            row.innerHTML = `
              <div>
                <span class="text-slate-800 font-bold font-mono text-[13px]">${fmtTwd(exp.amount)}</span>
                <span class="text-slate-500 text-[11px] ml-1">(${exp.description || '無備註'})</span>
                <div class="text-[10px] text-slate-400 mt-0.5">比例：臨安 ${Math.round(ratio*100)}% / 南科 ${Math.round((1-ratio)*100)}%</div>
              </div>
              ${isEditMode ? `
                <div class="flex gap-2">
                  <button onclick="event.stopPropagation(); editExpense('${exp.id}')" class="w-7 h-7 bg-slate-50 hover:bg-slate-100 rounded-full flex items-center justify-center text-slate-500"><i class="fas fa-pencil-alt text-[10px]"></i></button>
                  <button onclick="event.stopPropagation(); deleteExpense('${exp.id}', '${exp.amount}', '${exp.description}')" class="w-7 h-7 bg-red-50 hover:bg-red-100 rounded-full flex items-center justify-center text-red-500"><i class="fas fa-trash-alt text-[10px]"></i></button>
                </div>
              ` : ''}
            `;
            grid.appendChild(row);
          });
          mktSection.appendChild(grid);
        }
        body.appendChild(mktSection);

        // 週店別獨立業績比對分析
        const salesSection = document.createElement("div");
        salesSection.className = "space-y-2.5 pt-1.5";
        salesSection.innerHTML = `<div class="border-b border-slate-100 pb-1.5"><span class="text-xs font-bold text-slate-600"><i class="fas fa-chart-line text-blue-500"></i> 週店別獨立對比分析</span></div>`;

        if (mData.weeks.length === 0) {
          salesSection.innerHTML += `<p class="text-xs text-slate-400 italic py-2">無週業績數據（請在業績儀表板建立）。</p>`;
        } else {
          const list = document.createElement("div"); list.className = "space-y-3";
          mData.weeks.forEach(row => {
            const s = parseISODateLocal(row.week_start_date), e = addDays(s, 6);
            const rangeText = `${s.getMonth() + 1}/${s.getDate()} ~ ${e.getMonth() + 1}/${e.getDate()}`;
            const linanRev = Number(row.linan_amount || 0), nankeRev = Number(row.nanke_amount || 0);

            const linanWAlloc = mData.dailyLinanExpense * 7, nankeWAlloc = mData.dailyNankeExpense * 7;

            let lBadge = "", lText1 = "", lText2 = "", nBadge = "", nText1 = "", nText2 = "";

            if (mData.totalExpense === 0) {
              const empty = `<span class="px-2 py-0.5 rounded-full text-[10px] bg-slate-100 text-slate-400">無支出</span>`;
              lBadge = nBadge = empty; lText1 = nText1 = "（未設定支出，無法對比）";
            } else {
              // 臨安店 (加權 72% / 28% 分攤)
              const lRatio1 = linanRev / (linanWAlloc || 1), isLProf = linanRev >= linanWAlloc;
              lBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] ${isLProf ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'} font-bold">臨安 ${isLProf ? '賺' : '賠'} ${lRatio1.toFixed(1)} 倍</span>`;
              lText1 = `營收約為分攤行銷的 <strong class="${isLProf ? 'text-emerald-600' : 'text-rose-600'} font-mono">${lRatio1.toFixed(1)} 倍</strong>`;
              lText2 = `日均營收是分攤支出的 <strong class="text-slate-800 font-mono">${((linanRev/7)/(mData.dailyLinanExpense||1)).toFixed(1)} 倍</strong> <span class="text-slate-400 text-[10px] block">（每日最少需達 ${fmtTwd(mData.dailyLinanExpense)} 才不賠）</span>`;

              // 南科店
              const nRatio1 = nankeRev / (nankeWAlloc || 1), isNProf = nankeRev >= nankeWAlloc;
              nBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] ${isNProf ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'} font-bold">南科 ${isNProf ? '賺' : '賠'} ${nRatio1.toFixed(1)} 倍</span>`;
              nText1 = `營收約為分攤行銷的 <strong class="${isNProf ? 'text-emerald-600' : 'text-rose-600'} font-mono">${nRatio1.toFixed(1)} 倍</strong>`;
              nText2 = `日均營收是分攤支出的 <strong class="text-slate-800 font-mono">${((nankeRev/7)/(mData.dailyNankeExpense||1)).toFixed(1)} 倍</strong> <span class="text-slate-400 text-[10px] block">（每日最少需達 ${fmtTwd(mData.dailyNankeExpense)} 才不賠）</span>`;
            }

            const item = document.createElement("div");
            item.className = "bg-white/40 rounded-2xl p-3.5 border border-slate-100 shadow-sm";
            item.innerHTML = `
              <div class="flex justify-between items-center pb-2 mb-3 border-b border-slate-100 font-bold text-slate-700">
                <span><i class="far fa-clock"></i> ${rangeText}</span>
                <div class="flex gap-1.5">${lBadge}${nBadge}</div>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-slate-600 divide-y md:divide-y-0 md:divide-l divide-slate-100">
                <div class="space-y-1">
                  <div class="font-bold text-slate-800 flex items-center gap-1.5"><span class="w-2 h-3.5 bg-orange-500 rounded-full"></span> 臨安店</div>
                  <p>週收支比：${lText1}</p><p>日均指標：${lText2}</p>
                  <div class="text-[10px] text-slate-400 font-mono mt-1">週收: ${fmtTwd(linanRev)} / 週攤: ${fmtTwd(linanWAlloc)}</div>
                </div>
                <div class="space-y-1 pt-3 md:pt-0 md:pl-4">
                  <div class="font-bold text-slate-800 flex items-center gap-1.5"><span class="w-2 h-3.5 bg-blue-500 rounded-full"></span> 南科店</div>
                  <p>週收支比：${nText1}</p><p>日均指標：${nText2}</p>
                  <div class="text-[10px] text-slate-400 font-mono mt-1">週收: ${fmtTwd(nankeRev)} / 週攤: ${fmtTwd(nankeWAlloc)}</div>
                </div>
              </div>
            `;
            list.appendChild(item);
          });
          salesSection.appendChild(list);
        }
        body.appendChild(salesSection);
        div.appendChild(body);
      }
      return div;
    }

    // ===== 11. 儲存/新增/刪除業務函數（統一由最上層 Window 掛載） =====
    function openExpenseModal(id = null, defYear = null, defMonth = null) {
      dom.expenseModal.classList.remove("hidden");
      dom.expenseForm.reset();

      if (id) {
        dom.expenseModalTitle.textContent = "修改行銷支出";
        dom.editExpenseId.value = id;
        const item = allExpenses.find(e => e.id === id);
        if (item) {
          dom.inputYear.value = item.year; dom.inputMonth.value = item.month;
          dom.inputAmount.value = item.amount; dom.inputDescription.value = item.description || "";
          const linanRatioPct = item.linan_ratio != null ? Math.round(item.linan_ratio * 100) : 72;
          dom.inputLinanRatio.value = linanRatioPct; updateRatioDisplay(linanRatioPct);
        }
      } else {
        dom.expenseModalTitle.textContent = "新增行銷支出";
        dom.editExpenseId.value = "";
        if (defYear) dom.inputYear.value = defYear;
        if (defMonth) dom.inputMonth.value = defMonth;
        
        const targetYear = defYear || thisYear, targetMonth = defMonth || (new Date().getMonth() + 1);
        const linanRatioPct = Math.round(inheritRatio(targetYear, targetMonth) * 100);
        dom.inputLinanRatio.value = linanRatioPct; updateRatioDisplay(linanRatioPct);
      }
    }

    function closeExpenseModal() { dom.expenseModal.classList.add("hidden"); }

    async function handleExpenseSubmit(e) {
      e.preventDefault();
      try {
        const id = dom.editExpenseId.value.trim();
        const year = parseInt(dom.inputYear.value), month = parseInt(dom.inputMonth.value);
        const amount = Number(dom.inputAmount.value), description = dom.inputDescription.value.trim();
        const ratio = parseFloat(dom.inputLinanRatio.value) / 100;

        if (isNaN(amount) || amount <= 0) {
          Swal.fire({ icon: "warning", title: "請輸入有效金額", background: "#FFFFFF", color: "#1F1F1F" }); return;
        }

        const payload = { year, month, amount, description, linan_ratio: ratio };

        let res;
        if (id) {
          res = await supabase.from("marketing_expenses").update(payload).eq("id", id);
          if (res.error) throw res.error;
          await writeLog("修改", `修改 ${year}/${month}月 支出: $${amount} (臨安 ${Math.round(ratio*100)}%), 備註: ${description}`);
        } else {
          res = await supabase.from("marketing_expenses").insert([payload]);
          if (res.error) throw res.error;
          await writeLog("新增", `新增 ${year}/${month}月 支出: $${amount} (臨安 ${Math.round(ratio*100)}%), 備註: ${description}`);
        }

        closeExpenseModal();
        Swal.fire({ icon: "success", title: "儲存成功", timer: 800, showConfirmButton: false, background: "#FFFFFF", color: "#1F1F1F" });
        await refreshData();
        renderAll();
      } catch (err) {
        console.error("儲存失敗:", err);
        Swal.fire({ icon: "error", title: "儲存失敗", text: err.message || "資料庫寫入受阻，請檢查 Supabase 設定與欄位結構是否完整！", background: "#FFFFFF", color: "#1F1F1F" });
      }
    }

    function editExpense(id) { openExpenseModal(id); }

    async function deleteExpense(id, amount, desc) {
      const confirm = await Swal.fire({
        title: "確認刪除此筆支出？", text: `金額：${fmtTwd(amount)} (${desc})`, icon: "warning",
        showCancelButton: true, confirmButtonColor: "#ef4444", cancelButtonColor: "#64748B", confirmButtonText: "確定刪除", background: "#FFFFFF", color: "#1F1F1F"
      });

      if (confirm.isConfirmed) {
        try {
          const res = await supabase.from("marketing_expenses").delete().eq("id", id);
          if (res.error) throw res.error;
          await writeLog("刪除", `刪除支出: $${amount} (${desc})`);
          Swal.fire({ icon: "success", title: "已刪除", timer: 800, showConfirmButton: false, background: "#FFFFFF", color: "#1F1F1F" });
          await refreshData();
          renderAll();
        } catch (err) {
          Swal.fire({ icon: "error", title: "刪除失敗", text: err.message, background: "#FFFFFF", color: "#1F1F1F" });
        }
      }
    }

    async function writeLog(action, details) {
      try { await supabase.from("marketing_logs").insert([{ action, details }]); } 
      catch (err) { console.error("日誌寫入失敗:", err); }
    }

    async function openLogsModal() {
      dom.logsModal.classList.remove("hidden");
      dom.logsContainer.innerHTML = `<div class="text-xs text-slate-500 py-4"><i class="fas fa-spinner fa-spin mr-1"></i> 讀取紀錄中...</div>`;
      try {
        const { data, error } = await supabase.from("marketing_logs").select("*").order("created_at", { ascending: false }).limit(40);
        if (error) throw error;

        if(!data || data.length === 0) {
          dom.logsContainer.innerHTML = `<p class="text-xs text-slate-400 italic py-4">目前無任何日誌紀錄。</p>`; return;
        }

        let html = `<div class="space-y-2">`;
        data.forEach(log => {
          const timeStr = new Date(log.created_at).toLocaleString("zh-TW", { hour12: false });
          let badge = "bg-slate-100 text-slate-600";
          if(log.action === "新增") badge = "bg-emerald-50 text-emerald-600 border border-emerald-200";
          if(log.action === "修改") badge = "bg-amber-50 text-amber-600 border border-amber-200";
          if(log.action === "刪除") badge = "bg-rose-50 text-rose-600 border border-rose-200";

          html += `
            <div class="bg-white/60 p-3 rounded-xl border border-slate-100 text-xs">
              <div class="flex items-center justify-between mb-1">
                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${badge}">${log.action}</span>
                <span class="text-slate-400 text-[10px] font-mono">${timeStr}</span>
              </div>
              <p class="text-slate-600 font-medium">${log.details}</p>
            </div>
          `;
        });
        html += `</div>`; dom.logsContainer.innerHTML = html;
      } catch (err) {
        dom.logsContainer.innerHTML = `<p class="text-xs text-red-500 p-4">載入失敗: ${err.message}</p>`;
      }
    }

    function closeLogsModal() { dom.logsModal.classList.add("hidden"); }
  </script>
</body>
</html>
