    body { font-family: system-ui, -apple-system, sans-serif; background-color: #FAFAFA; color: #1F1F1F; }
    
    .glass-panel { 
      background: rgba(255, 255, 255, 0.75);

    /* 美化原生拉桿 */

      height: 6px;
      border-radius: 10px;

    .ratio-slider::-webkit-slider-thumb {

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const SUPABASE_URL = "https://yxalpzculcyhzvnyvecb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_NqpdQeAYGWTFBcdjkAQ4eQ_AT2GXf5k";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const FRONT_PASS = "wakodo1000";
    const FRONT_KEY  = "wakodo_mkt_access_v3";
    const FRONT_TTL  = 7 * 24 * 60 * 60 * 1000;

    let isEditMode = false;
    let loadedSales = [];
    let loadedExpenses = [];
    let allMonthKeys = [];
    const loadedMonths = new Set();
    const expandedGroups = new Set();
    let currentFocusMonth = null;

    const dom = {
      lockScreen: document.getElementById("lockScreen"),
      accessPassword: document.getElementById("accessPassword"),
      btnEnter: document.getElementById("btnEnter"),
      btnToggleMode: document.getElementById("btnToggleMode"),
      btnShowLogs: document.getElementById("btnShowLogs"),
      monthlyContainer: document.getElementById("monthlyContainer"),
      summaryTotal: document.getElementById("summaryTotal"),
      summaryDaily: document.getElementById("summaryDaily"),
      summaryMonthLabel: document.getElementById("summaryMonthLabel"),
      btnExpandAll: document.getElementById("btnExpandAll"),
      btnCollapseAll: document.getElementById("btnCollapseAll"),
      expenseModal: document.getElementById("expenseModal"),
      expenseForm: document.getElementById("expenseForm"),
      expenseModalTitle: document.getElementById("expenseModalTitle"),
      editExpenseId: document.getElementById("editExpenseId"),
      inputYear: document.getElementById("inputYear"),
      inputMonth: document.getElementById("inputMonth"),
      inputAmount: document.getElementById("inputAmount"),
      inputDescription: document.getElementById("inputDescription"),
      inputLinanRatio: document.getElementById("inputLinanRatio"),
      ratioDisplay: document.getElementById("ratioDisplay"),
      logsModal: document.getElementById("logsModal"),
      logsContainer: document.getElementById("logsContainer")
    };

    // 初始化年份選單
    const thisYear = new Date().getFullYear();
    for(let y = thisYear - 1; y <= thisYear + 1; y++) {
      const opt = document.createElement("option");
      opt.value = y;
      opt.textContent = `${y} 年`;
      if(y === thisYear) opt.selected = true;
      dom.inputYear.appendChild(opt);
    }

    // ===== 密碼安全驗證 =====
    function setAccess() { localStorage.setItem(FRONT_KEY, JSON.stringify({ expire: Date.now() + FRONT_TTL })); }
    function checkAccess() {
      const raw = localStorage.getItem(FRONT_KEY);
      if (!raw) return false;
      try {
        const obj = JSON.parse(raw);
        if (!obj?.expire || Date.now() > obj.expire) return false;
        setAccess(); 
        return true;
      } catch { return false; }
    }

    if (checkAccess()) {
      dom.lockScreen.classList.add("hidden");
      initApp();
    } else {
      dom.lockScreen.classList.remove("hidden");
      dom.accessPassword.focus();
    }

    dom.btnEnter.addEventListener("click", doUnlock);
    dom.accessPassword.addEventListener("keydown", (e) => { if (e.key === "Enter") doUnlock(); });

    function doUnlock() {
      const val = dom.accessPassword.value.trim();
      if (val !== FRONT_PASS) {
        Swal.fire({ icon: "error", title: "密碼錯誤", text: "請輸入正確的前台密碼！", background: "#FFFFFF", color: "#1F1F1F" });
        return;
      }
      setAccess();
      dom.lockScreen.classList.add("hidden");
      initApp();
    }

    // ===== 日期運算工具 =====
    function fmtTwd(n) {
      return new Intl.NumberFormat("zh-TW", { style: "currency", currency: "TWD", maximumFractionDigits: 0 }).format(Number(n || 0));
    }
    function getDaysInMonth(year, month) {
      return new Date(year, month, 0).getDate();
    }
    function parseISODateLocal(dateStr){
      const [y, m, d] = String(dateStr).split("-").map(Number);
      return new Date(y, m - 1, d || 1);
    }
    function toISODateLocal(dt){
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
    }
    function addDays(dt, days){
      const x = new Date(dt);
      x.setDate(x.getDate() + days);
      return x;
    }

    function getMajorMonth(isoDateStr) {
      const wkStart = parseISODateLocal(isoDateStr);
      const counts = new Map();
      for (let i = 0; i < 7; i++) {
        const x = addDays(wkStart, i);
        const key = `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}`;
        counts.set(key, (counts.get(key) || 0) + 1);
      }
      let bestKey = null;
      let bestDays = -1;
      for (const [k, days] of counts.entries()) {
        if (days > bestDays) { bestDays = days; bestKey = k; continue; }
        if (days === bestDays && bestKey && k > bestKey) bestKey = k;
      }
      const [yy, mm] = String(bestKey).split("-");
      return { year: Number(yy), month: Number(mm), key: bestKey };
    }

    // ===== 系統初始化與數據懶加載 =====
    async function initApp() {
      bindEvents();
      await fetchAllMonthMetadata();
      await preloadLatestData();
      renderAll();
    }

    function bindEvents() {
      dom.btnToggleMode.addEventListener("click", () => {
        isEditMode = !isEditMode;
        if(isEditMode) {
          dom.btnToggleMode.innerHTML = `<i class="fas fa-check text-green-500"></i> <span>結束編輯</span>`;
          dom.btnToggleMode.className = "text-xs font-bold text-green-700 bg-green-50 hover:bg-green-100 px-4 py-1.5 rounded-lg border border-green-200 transition shadow-sm flex items-center gap-1.5";
        } else {
          dom.btnToggleMode.innerHTML = `<i class="fas fa-edit text-slate-400"></i> <span>進入編輯</span>`;
          dom.btnToggleMode.className = "text-xs font-bold text-slate-700 bg-white hover:bg-slate-50 px-4 py-1.5 rounded-lg border border-slate-200 transition shadow-sm flex items-center gap-1.5";
        }
        renderAll();
      });

      dom.btnShowLogs.addEventListener("click", openLogsModal);

      dom.btnExpandAll.addEventListener("click", async () => {
        Swal.fire({
          title: "正在展開舊月份...",
          text: "系統正自動抓取尚未下載的月份行銷開支...",
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading()
        });

        const unloadKeys = allMonthKeys.filter(k => !loadedMonths.has(k));
        if (unloadKeys.length > 0) {
          await fetchBatchMonthsData(unloadKeys);
        }

        allMonthKeys.forEach(k => expandedGroups.add(k));
        Swal.close();
        renderAll();
      });

      dom.btnCollapseAll.addEventListener("click", () => {
        expandedGroups.clear();
        renderAll();
      });

      dom.expenseForm.addEventListener("submit", handleExpenseSubmit);

      // 監聽拉桿數值變化
      dom.inputLinanRatio.addEventListener("input", (e) => {
        updateRatioDisplay(e.target.value);
      });

      // 監聽年月下拉選單以進行比例繼承
      dom.inputYear.addEventListener("change", handleDateChangeToInherit);
      dom.inputMonth.addEventListener("change", handleDateChangeToInherit);
    }

    function updateRatioDisplay(val) {
      const linan = parseInt(val);
      const nanke = 100 - linan;
      dom.ratioDisplay.textContent = `${linan}% : ${nanke}%`;
    }

    // 當編輯彈窗變更年、月時，自動繼承前月或最新月之比例設定
    function handleDateChangeToInherit() {
      // 僅在「新增模式」下才自動變更
      if (dom.editExpenseId.value !== "") return;
      
      const year = parseInt(dom.inputYear.value);
      const month = parseInt(dom.inputMonth.value);
      const ratio = inheritRatio(year, month);
      
      const val = Math.round(ratio * 100);
      dom.inputLinanRatio.value = val;
      updateRatioDisplay(val);
    }

    // 智慧繼承比值算法
    function inheritRatio(year, month) {
      let prevMonth = month - 1;
      let prevYear = year;
      if (prevMonth === 0) {
        prevMonth = 12;
        prevYear = year - 1;
      }

      // 1. 優先尋找「前一個月」的任何支出數據比例
      const exactMatch = loadedExpenses.find(e => e.year === prevYear && e.month === prevMonth);
      if (exactMatch && exactMatch.linan_ratio !== undefined && exactMatch.linan_ratio !== null) {
        return Number(exactMatch.linan_ratio);
      }

      // 2. 備用方案：尋找「最新一筆有紀錄」的比例
      if (loadedExpenses.length > 0) {
        const sorted = [...loadedExpenses].sort((a,b) => (b.year * 12 + b.month) - (a.year * 12 + a.month));
        const latest = sorted[0];
        if (latest && latest.linan_ratio !== undefined && latest.linan_ratio !== null) {
          return Number(latest.linan_ratio);
        }
      }

      // 3. 全無數據：預設 72%
      return 0.72;
    }

    async function fetchAllMonthMetadata() {
      const [salesRes, mktRes] = await Promise.all([
        supabase.from("sales_performance").select("year, month").eq("period_type", "weekly"),
        supabase.from("marketing_expenses").select("year, month")
      ]);

      const keys = new Set();
      (salesRes.data || []).forEach(row => {
        keys.add(`${row.year}-${String(row.month).padStart(2, "0")}`);
      });
      (mktRes.data || []).forEach(row => {
        keys.add(`${row.year}-${String(row.month).padStart(2, "0")}`);
      });

      allMonthKeys = Array.from(keys).sort().reverse();
    }

    async function preloadLatestData() {
      if (allMonthKeys.length === 0) return;
      const latest3 = allMonthKeys.slice(0, 3);
      await fetchBatchMonthsData(latest3);
      
      expandedGroups.add(latest3[0]);
      currentFocusMonth = latest3[0];
    }

    async function fetchBatchMonthsData(keys) {
      if (keys.length === 0) return;

      const filterList = keys.map(k => {
        const [y, m] = k.split("-");
        return `and(year.eq.${y},month.eq.${parseInt(m)})`;
      }).join(",");

      const [salesRes, mktRes] = await Promise.all([
        supabase.from("sales_performance").select("*").eq("period_type", "weekly").or(filterList),
        supabase.from("marketing_expenses").select("*").or(filterList)
      ]);

      if (salesRes.data) {
        const ids = new Set(salesRes.data.map(d => d.id));
        loadedSales = loadedSales.filter(s => !ids.has(s.id)).concat(salesRes.data);
      }
      if (mktRes.data) {
        const ids = new Set(mktRes.data.map(d => d.id));
        loadedExpenses = loadedExpenses.filter(e => !ids.has(e.id)).concat(mktRes.data);
      }

      keys.forEach(k => loadedMonths.add(k));
    }

    async function lazyLoadSingleMonth(key) {
      if (loadedMonths.has(key)) return;

      const [y, m] = key.split("-");
      const [salesRes, mktRes] = await Promise.all([
        supabase.from("sales_performance").select("*").eq("period_type", "weekly").eq("year", y).eq("month", parseInt(m)),
        supabase.from("marketing_expenses").select("*").eq("year", y).eq("month", parseInt(m))
      ]);

      if (salesRes.data) loadedSales = loadedSales.concat(salesRes.data);
      if (mktRes.data) loadedExpenses = loadedExpenses.concat(mktRes.data);

      loadedMonths.add(key);
    }

    // ===== 業務邏輯對比分析運算 =====
    function buildMonthlyData(key) {
      const [year, month] = key.split("-").map(Number);
      const days = getDaysInMonth(year, month);

      // 取得當月所有費用
      const expenses = loadedExpenses.filter(e => e.year === year && e.month === month);
      const totalExpense = expenses.reduce((sum, e) => sum + Number(e.amount || 0), 0);
      const dailyExpense = totalExpense / days;

      // 關鍵核心：根據每筆費用之獨立 linan_ratio 比例計算各店在當月的「加權分攤總額」
      let totalLinanExpense = 0;
      let totalNankeExpense = 0;

      expenses.forEach(e => {
        const ratio = e.linan_ratio !== undefined && e.linan_ratio !== null ? Number(e.linan_ratio) : 0.72;
        totalLinanExpense += Number(e.amount) * ratio;
        totalNankeExpense += Number(e.amount) * (1 - ratio);
      });

      const dailyLinanExpense = totalLinanExpense / days;
      const dailyNankeExpense = totalNankeExpense / days;

      const weeks = loadedSales.filter(s => {
        if (!s.week_start_date) return false;
        const major = getMajorMonth(s.week_start_date);
        return major.key === key;
      });

      weeks.sort((a, b) => parseISODateLocal(a.week_start_date).getTime() - parseISODateLocal(b.week_start_date).getTime());

      return { 
        key, year, month, days, expenses, totalExpense, dailyExpense,
        totalLinanExpense, totalNankeExpense,
        dailyLinanExpense, dailyNankeExpense,
        weeks 
      };
    }

    function renderAll() {
      dom.monthlyContainer.innerHTML = "";

      if(allMonthKeys.length === 0) {
        dom.monthlyContainer.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">目前無任何數據紀錄。</div>`;
        updateSummaryCard(null);
        return;
      }

      if(!currentFocusMonth || !allMonthKeys.includes(currentFocusMonth)) {
        currentFocusMonth = allMonthKeys[0];
      }

      const focusData = buildMonthlyData(currentFocusMonth);
      updateSummaryCard(focusData);

      allMonthKeys.forEach(key => {
        const card = createMonthlyCard(key);
        dom.monthlyContainer.appendChild(card);
      });
    }

      if(!mData || !loadedMonths.has(mData.key)) {

    async function handleMonthToggle(key) {
      if (expandedGroups.has(key)) {
        expandedGroups.delete(key);
        renderAll();
      } else {
        expandedGroups.add(key);
        currentFocusMonth = key;
        renderAll();

        if (!loadedMonths.has(key)) {
          await lazyLoadSingleMonth(key);
          renderAll(); 
        }
      }
    }

    // ===== 行銷支出編輯 =====
    window.openExpenseModal = function(id = null, defYear = null, defMonth = null) {
      dom.expenseModal.classList.remove("hidden");
      dom.expenseForm.reset();

      if (id) {
        dom.expenseModalTitle.textContent = "修改行銷支出";
        dom.editExpenseId.value = id;
        const item = loadedExpenses.find(e => e.id === id);
        if (item) {
          dom.inputYear.value = item.year;
          dom.inputMonth.value = item.month;
          dom.inputAmount.value = item.amount;
          dom.inputDescription.value = item.description || "";
          
          const linanRatioPct = item.linan_ratio !== undefined && item.linan_ratio !== null ? Math.round(item.linan_ratio * 100) : 72;
          dom.inputLinanRatio.value = linanRatioPct;
          updateRatioDisplay(linanRatioPct);
        }
      } else {
        dom.expenseModalTitle.textContent = "新增行銷支出";
        dom.editExpenseId.value = "";
        if (defYear) dom.inputYear.value = defYear;
        if (defMonth) dom.inputMonth.value = defMonth;
        
        // 智慧型自動繼承上月份分配比例
        const targetYear = defYear || thisYear;
        const targetMonth = defMonth || (new Date().getMonth() + 1);
        const inheritedRatio = inheritRatio(targetYear, targetMonth);
        const linanRatioPct = Math.round(inheritedRatio * 100);
        
        dom.inputLinanRatio.value = linanRatioPct;
        updateRatioDisplay(linanRatioPct);
      }
    };

    window.closeExpenseModal = function() {
      dom.expenseModal.classList.add("hidden");
    };

    async function handleExpenseSubmit(e) {
      e.preventDefault();
      const id = dom.editExpenseId.value.trim();
      const year = parseInt(dom.inputYear.value);
      const month = parseInt(dom.inputMonth.value);
      const amount = Number(dom.inputAmount.value);
      const description = dom.inputDescription.value.trim();
      
      const linan_ratio = parseFloat(dom.inputLinanRatio.value) / 100;

      const payload = { 
        year, 
        month, 
        amount, 
        description, 
        linan_ratio: linan_ratio 
      };

      let res;
      if (id) {
        const oldItem = loadedExpenses.find(x => x.id === id);
        res = await supabase.from("marketing_expenses").update(payload).eq("id", id);
        if(!res.error) {
          await writeLog("修改", `修改 ${year}/${month}月 行銷開支: $${amount} (臨安分攤: ${Math.round(linan_ratio*100)}%), 備註: ${description}`);
        }
      } else {
        res = await supabase.from("marketing_expenses").insert([payload]);
        if(!res.error) {
          await writeLog("新增", `新增 ${year}/${month}月 行銷開支: $${amount} (臨安分攤: ${Math.round(linan_ratio*100)}%), 備註: ${description}`);
        }
      }

      if (res.error) {
        Swal.fire({ icon: "error", title: "儲存失敗", text: res.error.message, background: "#FFFFFF", color: "#1F1F1F" });
        return;
      }

      closeExpenseModal();
      Swal.fire({ icon: "success", title: "儲存成功", timer: 800, showConfirmButton: false, background: "#FFFFFF", color: "#1F1F1F" });
      
      await refreshAfterWrite(year, month);
      renderAll();
    }

    window.editExpense = function(id) {
      openExpenseModal(id);
    };

    window.deleteExpense = async function(id, amount, desc) {
      const confirm = await Swal.fire({
        title: "確認刪除此筆支出？",
        text: `金額：${fmtTwd(amount)} (${desc})`,
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: "#ef4444",
        cancelButtonColor: "#64748B",
        confirmButtonText: "確定刪除",
        cancelButtonText: "取消",
        background: "#FFFFFF",
        color: "#1F1F1F"
      });

      if (confirm.isConfirmed) {
        const item = loadedExpenses.find(e => e.id === id);
        const res = await supabase.from("marketing_expenses").delete().eq("id", id);
        if (res.error) {
          Swal.fire({ icon: "error", title: "刪除失敗", text: res.error.message, background: "#FFFFFF", color: "#1F1F1F" });
          return;
        }
        await writeLog("刪除", `刪除行銷支出: $${amount} (${desc})`);
        Swal.fire({ icon: "success", title: "已刪除", timer: 800, showConfirmButton: false, background: "#FFFFFF", color: "#1F1F1F" });
        
        if (item) {
          await refreshAfterWrite(item.year, item.month);
        }
        renderAll();
      }
    };

    async function refreshAfterWrite(year, month) {
      const key = `${year}-${String(month).padStart(2, "0")}`;
      
      const [salesRes, mktRes] = await Promise.all([
        supabase.from("sales_performance").select("*").eq("period_type", "weekly").eq("year", year).eq("month", month),
        supabase.from("marketing_expenses").select("*").eq("year", year).eq("month", month)
      ]);

      loadedSales = loadedSales.filter(s => !(s.year === year && s.month === month));
      loadedExpenses = loadedExpenses.filter(e => !(e.year === year && e.month === month));

      if (salesRes.data) loadedSales = loadedSales.concat(salesRes.data);
      if (mktRes.data) loadedExpenses = loadedExpenses.concat(mktRes.data);

      if(!allMonthKeys.includes(key)) {
        allMonthKeys.unshift(key); 
        allMonthKeys.sort().reverse();
      }
      loadedMonths.add(key);
    }

    // ===== 操作日誌 =====
    window.openLogsModal = async function() {
      dom.logsModal.classList.remove("hidden");
      dom.logsContainer.innerHTML = `<div class="text-xs text-slate-500 py-4"><i class="fas fa-spinner fa-spin mr-1"></i> 讀取紀錄中...</div>`;

      const { data, error } = await supabase.from("marketing_logs").select("*").order("created_at", { ascending: false }).limit(40);
      if (error) {
        dom.logsContainer.innerHTML = `<p class="text-xs text-red-400">無法加載日誌: ${error.message}</p>`;
        return;
      }

      if(!data || data.length === 0) {
        dom.logsContainer.innerHTML = `<p class="text-xs text-slate-400 italic py-4">目前尚無任何編輯歷史日誌紀錄。</p>`;
        return;
      }

      let html = `<div class="space-y-2">`;
      data.forEach(log => {
        const timeStr = new Date(log.created_at).toLocaleString("zh-TW", { hour12: false });
        let badgeColor = "bg-slate-100 text-slate-600";
        if(log.action === "新增") badgeColor = "bg-emerald-50 text-emerald-600 border border-emerald-200";
        if(log.action === "修改") badgeColor = "bg-amber-50 text-amber-600 border border-amber-200";
        if(log.action === "刪除") badgeColor = "bg-rose-50 text-rose-600 border border-rose-200";

        html += `
          <div class="bg-white/60 p-3 rounded-xl border border-slate-100 text-xs">
            <div class="flex items-center justify-between mb-1.5">
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${badgeColor}">${log.action}</span>
              <span class="text-slate-400 text-[10px] font-mono">${timeStr}</span>
            </div>
            <p class="text-slate-600 font-medium">${log.details}</p>
          </div>
        `;
      });
      html += `</div>`;
      dom.logsContainer.innerHTML = html;
    };

    window.closeLogsModal = function() {
      dom.logsModal.classList.add("hidden");
    };
  </script>
</body>
</html>
